<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1170" viewBox="0 0 1024 1170" role="img" aria-labelledby="title desc">
<title id="title">Atmet Brain terminal welcome</title>
<desc id="desc">Rendered output from the actual welcome command with a fictional company home. Orange terminal wordmark and setup commands.</desc>
<rect width="1024" height="1170" fill="#101010"/>
<rect width="1024" height="39" fill="#1d1d1d"/>
<circle cx="27" cy="18" r="5" fill="#ff5f57"/>
<circle cx="49" cy="18" r="5" fill="#febc2e"/>
<circle cx="71" cy="18" r="5" fill="#28c840"/>
<g font-family="Menlo,Consolas,monospace" font-size="17" xml:space="preserve">
<text x="420" y="27" fill="#ababab">atmet-brain</text>
<text x="28" y="82"></text>
<text x="28" y="107"><tspan fill="#f55315">    ██████    ██████████  ██      ██  ██████████  ██████████</tspan></text>
<text x="28" y="132"><tspan fill="#f55315">  ████  ████      ██      ████  ████  ██              ██</tspan></text>
<text x="28" y="157"><tspan fill="#f55315">  ████  ████      ██      ██████████  ████████        ██</tspan></text>
<text x="28" y="182"><tspan fill="#f55315">  ██████████      ██      ██  ██  ██  ██              ██</tspan></text>
<text x="28" y="207"><tspan fill="#f55315">  ████  ████      ██      ██      ██  ██              ██</tspan></text>
<text x="28" y="232"><tspan fill="#f55315">  ████  ████      ██      ██      ██  ██████████      ██</tspan></text>
<text x="28" y="257"></text>
<text x="28" y="282"><tspan fill="#dedede">  Atmet Brain  /  0.8.0</tspan></text>
<text x="28" y="307"><tspan fill="#929292">  Company memory. Workflows. Your agents.</tspan></text>
<text x="28" y="332"><tspan fill="#929292">  ──────────────────────────────────────────────────────────</tspan></text>
<text x="28" y="357"></text>
<text x="28" y="382"><tspan fill="#dedede">  Start with your company.</tspan></text>
<text x="28" y="407"><tspan fill="#929292">  Build one department and one workflow, then connect your agents.</tspan></text>
<text x="28" y="432"></text>
<text x="28" y="457"><tspan fill="#929292">  Home  /srv/example-company/brain</tspan></text>
<text x="28" y="482"></text>
<text x="28" y="507"><tspan fill="#dedede">  Set up a Brain</tspan></text>
<text x="28" y="532"><tspan fill="#f55315">    atmet-brain --home /srv/example-company/brain setup</tspan></text>
<text x="28" y="557"></text>
<text x="28" y="582"><tspan fill="#dedede">  Inspect this Brain</tspan></text>
<text x="28" y="607"><tspan fill="#f55315">    atmet-brain --home /srv/example-company/brain status</tspan></text>
<text x="28" y="632"></text>
<text x="28" y="657"><tspan fill="#dedede">  Choose a company Brain</tspan></text>
<text x="28" y="682"><tspan fill="#f55315">    atmet-brain --home /srv/example-company/brain brains</tspan></text>
<text x="28" y="707"></text>
<text x="28" y="732"><tspan fill="#dedede">  Manage employee access</tspan></text>
<text x="28" y="757"><tspan fill="#f55315">    atmet-brain --home /srv/example-company/brain team</tspan></text>
<text x="28" y="782"></text>
<text x="28" y="807"><tspan fill="#dedede">  Review agent changes and document intake</tspan></text>
<text x="28" y="832"><tspan fill="#f55315">    atmet-brain --home /srv/example-company/brain admin</tspan></text>
<text x="28" y="857"></text>
<text x="28" y="882"><tspan fill="#dedede">  Connect an agent</tspan></text>
<text x="28" y="907"><tspan fill="#f55315">    atmet-brain --home /srv/example-company/brain agent</tspan></text>
<text x="28" y="932"></text>
<text x="28" y="957"><tspan fill="#dedede">  Host a team Brain</tspan></text>
<text x="28" y="982"><tspan fill="#f55315">    atmet-brain --home /srv/example-company/brain host</tspan></text>
<text x="28" y="1007"></text>
<text x="28" y="1032"><tspan fill="#dedede">  Join your team</tspan></text>
<text x="28" y="1057"><tspan fill="#f55315">    atmet-brain --home /srv/example-company/brain join</tspan></text>
<text x="28" y="1082"></text>
<text x="28" y="1107"><tspan fill="#dedede">  Browse commands</tspan></text>
<text x="28" y="1132"><tspan fill="#f55315">    atmet-brain --help</tspan></text>
</g></svg>
