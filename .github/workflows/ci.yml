name: core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_project.py
      - run: python examples/demo.py
      - run: python examples/automation_demo.py
      - run: python -m pip wheel --no-deps . -w dist
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test npm/atmet-brain/test/*.test.mjs
      - run: python -m pip install build
      - run: python -m build --wheel --outdir dist/python
      - run: python scripts/prepare_npm.py --wheel dist/python/atmet_brain-*-py3-none-any.whl
      - run: mkdir -p dist/npm && npm pack ./npm/atmet-brain --pack-destination dist/npm
      - run: python scripts/check_npm_package.py dist/npm/atmet-brain-*.tgz
      - name: Run the packed npm core without an Atmet PyPI release
        env:
          ATMET_LAUNCHER_HOME: ${{ runner.temp }}/atmet-npm-smoke
        run: npx --yes --package "$(realpath dist/npm/atmet-brain-*.tgz)" atmet-brain --version
