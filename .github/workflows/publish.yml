name: publish packages
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Reviewed immutable release tag
        required: true
        default: v0.5.0
        type: string
      publish_npm:
        description: Publish the launcher through an existing npm trusted publisher
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'anashamad9/Atmet-brain'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: python scripts/check_release_tag.py
      - run: python -m pip install -e . build twine
      - run: python -m unittest discover -s tests -v
      - run: node --test npm/atmet-brain/test/*.test.mjs
      - run: python scripts/check_project.py
      - run: python -m build --outdir dist/python
      - run: python -m twine check dist/python/*
      - run: python scripts/prepare_npm.py --wheel dist/python/atmet_brain-*-py3-none-any.whl
      - run: mkdir -p dist/npm && npm pack ./npm/atmet-brain --pack-destination dist/npm
      - run: python scripts/check_npm_package.py dist/npm/atmet-brain-*.tgz
      - name: Run the packed npm core without an Atmet PyPI release
        env:
          ATMET_LAUNCHER_HOME: ${{ runner.temp }}/atmet-npm-smoke
        run: npx --yes --package "$(realpath dist/npm/atmet-brain-*.tgz)" atmet-brain --version
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/python/*
      - uses: actions/upload-artifact@v4
        with:
          name: npm-launcher
          path: dist/npm/*.tgz
  npm:
    if: vars.NPM_PUBLISH_ENABLED == 'true' && (github.event_name == 'push' || inputs.publish_npm)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/atmet-brain
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.17.0
      - uses: actions/download-artifact@v4
        with:
          name: npm-launcher
          path: dist/npm
      - run: python scripts/check_npm_package.py dist/npm/atmet-brain-*.tgz
      - name: Refuse duplicate versions and latest downgrades
        run: python scripts/check_npm_registry.py before dist/npm/atmet-brain-*.tgz
      - name: Publish through GitHub OIDC
        run: npm publish dist/npm/*.tgz --access public --provenance --registry=https://registry.npmjs.org
      - name: Verify public identity, integrity and latest
        run: python scripts/check_npm_registry.py after dist/npm/atmet-brain-*.tgz --receipt dist/npm/registry-receipt.json
      - name: Check a fresh public install
        env:
          ATMET_LAUNCHER_HOME: ${{ runner.temp }}/atmet-public-smoke
          NPM_CONFIG_CACHE: ${{ runner.temp }}/atmet-public-npm-cache
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$(npx --yes --package=atmet-brain@$VERSION atmet-brain --version)" = "Atmet Brain $VERSION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-publication-receipt
          path: dist/npm/registry-receipt.json
          if-no-files-found: ignore
