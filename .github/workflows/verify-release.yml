name: verify published release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable published release tag
        required: true
        default: v0.8.0
        type: string
permissions:
  contents: read
jobs:
  public-install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: verifier
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          path: released
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify existing release identity
        working-directory: released
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/check_release_tag.py
      - name: Download the exact published archive and verify registry integrity
        working-directory: released
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p dist/npm
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'atmet-brain-*.tgz' --dir dist/npm
          python scripts/check_npm_package.py dist/npm/atmet-brain-*.tgz
          python scripts/check_npm_registry.py after dist/npm/atmet-brain-*.tgz --receipt dist/npm/registry-receipt.json
      - name: Verify a fresh anonymous public install
        working-directory: released
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python ../verifier/scripts/check_public_install.py --version "$VERSION" --receipt dist/npm/public-install.json
      - uses: actions/upload-artifact@v4
        with:
          name: public-install-${{ matrix.os }}
          path: released/dist/npm/*.json
